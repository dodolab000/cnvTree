cnvTree_v_num: v051
cnvTree_msg: yes
cluster: 4.0  # (d = 4)
overlap_region: 5.0e+06   # (d = 5.0e+06)
consecutive_region: 5.0e+06   # (d = 5.0e+06)
difratio_chr: 0.2   # (d = 0.2)
dif_ratio: 0.2   # (d = 0.2)
# pqArm_cellnum: Numeric threshold specifying the minimum number of cells required 
# for a p/q arm pattern to be retained for downstream analysis.
pqArm_cellnum: 1   # (d = 1)
min_cell_GMM: 2  # (d = 2)
num_pcs: 30   # (d = 30)
g_clusters: 9 # set 9 to auto detect optimal group size
sexchromosome: no  # (d = no)
smoothheatmap: yes  # (d = yes)
entropy_threshold: 0.2   # (d = 0.2) set 1 to not drop any cell if using GMM
RNAdataSource: '2'   # InferCNV
# CN_state_grouping: Integer (3 or 6) specifying the resolution for grouping 
#   copy number states. Use 3 for basic classification (deletion, neutral, 
#   amplification) or 6 for higher resolution (deletion, lose, neutral, 
#   amplification, gain and high gain)
percentage: 0.5   # (d = 0.5)
