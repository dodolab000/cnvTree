pqArm_file: hg38             # 'hg19', 'hg38', 'mm10' or 'mm39'
input_dir_DNA: /path/to/scDNA_files
input_dir_RNA: /path/to/scRNA_files
output_dir: /path/to/save/cnvTree_outputs
min_cell_DNA: 5.0            # (d = 5)
min_cell_subclone: 1.0       # (d = 1)
min_cell_RNA: 5.0            # (d = 5)
cnv_ratio_DNA: 0.3           # (d = 0.3)
cnv_ratio_RNA: 0.5           # (d = 0.2)
GMM_mode: yes                # (d = no)
DNAdatasource: '1'           # '1' dataframe or "2' AneuFinder processed inputs
ZeroCol: no                  # (d = no)
treeType: DNARNA             # DNARNA or RNA
cost_calculate: 2nodeMul     # 2nodeMul, Rank_Mul, Rank_Add, Start_num or NULL
